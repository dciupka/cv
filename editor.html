<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Edytor</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="toolbar">
    <strong>CV — Edytor</strong>
    <span class="hint" id="status">Edytuj po lewej, podgląd po prawej.</span>
    <span class="spacer"></span>
    <label class="lang-pick">
      Podgląd:
      <select id="previewLang">
        <option value="en">EN</option>
        <option value="pl">PL</option>
      </select>
    </label>
    <button id="reloadBtn" class="btn ghost" title="Odśwież podgląd">↻ Podgląd</button>
    <button id="saveBtn" class="btn primary">💾 Zapisz content.js</button>
  </div>

  <div class="split">
    <div class="pane form-pane" id="form"></div>
    <div class="pane preview-pane">
      <iframe id="preview" src="index.html" title="Podgląd CV"></iframe>
    </div>
  </div>

  <!-- Load current content as the editor's starting data -->
  <script src="content.js"></script>
  <script src="editor.js"></script>
</body>
</html>
